services:
  - type: web
    name: product-explorer
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install uv && uv sync && .venv/bin/playwright install chromium
    startCommand: uv run uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AGENTMAIL_API_KEY
        sync: false
      - key: BROWSER_USE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.9
    disk:
      name: outputs
      mountPath: /opt/render/project/src/outputs
      sizeGB: 5
